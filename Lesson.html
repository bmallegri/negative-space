<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="Negative Space PFP.png" type="image/x-icon">
        <link rel="stylesheet" href="NegativeSpace.css">
        <title>Lesson</title>
    </head>
    <body>
        <div class = "Congrats">
            <p>Congrats! You did nothing!</p>
            <div class = "flower-scene">
                <div class = "particles">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <svg class="flower" viewBox="0 0 200 240">
                    <!-- stem -->
                     <path
                     class="stem"
                     d="M100 220 C100 180 100 150 100 115"
                     />
                     <!-- leaves -->
                      <path
                      class="leaf left-leaf"
                      d="M100 175 C75 165 55 175 48 195 C70 198 90 190 100 175Z"
                      />
                      <path
                      class="leaf right-leaf"
                      d="M100 150 C125 140 145 148 152 168 C130 170 112 163 100 150Z"
                      />
                      <!-- flower petals -->
                       <circle class="petal" cx="100" cy="65" r="30"/>
                       <circle class="petal" cx="135" cy="80" r="30"/>
                       <circle class="petal" cx="125" cy="115" r="30"/>
                       <circle class="petal" cx="75" cy="115" r="30"/>
                       <circle class="petal" cx="65" cy="80" r="30"/>
                       <!-- center -->
                        <circle class="flower-center" cx="100" cy="90" r="23"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class = "lesson">
            <p class = "Lesson-number" id = "Lesson-number"></p>
            <p class = "lesson-content" id = "lesson-content"></p>
        </div>
        <div class = "lesson-page-entry">
            <div class = "picture-frame">
                <img id = "journal-after" class = "journal-after" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKPuGsTQjWC5enXqWqti5NEq1ITP20goww4inGGtXYHw&s=10" alt ="After Image" width="200">
                <!--^Placeholder for drawn after image ^-->
                <select id="after-select" class="after-select">
                    <option value="" disabled selected>Select an image</option>
                    <option value="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfpYnrjiVS_bGXyUC0ytWDjDs9TDM0vdBjjolva9ya3w&s=10">Plant pot</option>
                    <option value="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQdQ1jaZclqUOtDtYcnuPQgUPfjOQ0U6NSidksAUOhcKg&s=10">Yellow flower</option>
                    <option value="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPKVusEc3XR-q-CHxV_O6StPTlNRewUFDRae4msMuXaA&s=10">Orange Flower</option>
                </select>
            </div>
            <div class = "entry-input">
                <input class = "lessonInput" type="text" id="lessonInput" placeholder="What did you do after your negative space?">
                <button class = "button" id="saveReflectionButton">Save</button>
            </div>
        </div>
        <script src="background.js"></script>
        <script src="Journal.js"></script>
    </body>
</html>
