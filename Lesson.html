<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="Negative Space PFP.png" type="image/x-icon">
        <link rel="stylesheet" href="NegativeSpace.css">
        <title>Lesson</title>
    </head>
    <body>
        <div class = "Congrats">
            <p>Congrats! You did nothing!</p>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbMcuJUu4CCgnQV4Bvm_7dmUJPG9iV5IoYq6Sl1qWJsw&s=10" alt="Flower" width="200"> 
            <!--^Placeholder for drawn flower^-->
        </div>
        <div class = "lesson">
            <p class = "Lesson-number" id = "Lesson-number">Lesson 1:</p>
            <p class = "lesson-content" id = "lesson-content">This will be lesson content later</p>
        </div>
        <div class = "lesson-page-entry">
            <div class = "picture-frame">
                <img id = "journal-after" class = "journal-after" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKPuGsTQjWC5enXqWqti5NEq1ITP20goww4inGGtXYHw&s=10" alt ="After Image" width="200">
                <!--^Placeholder for drawn after image ^-->
                <select id="after-select" class="after-select">
                    <option value="" disabled selected>Select an image</option>
                    <option value="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfpYnrjiVS_bGXyUC0ytWDjDs9TDM0vdBjjolva9ya3w&s=10">Image 1</option>

                    <option value="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPKVusEc3XR-q-CHxV_O6StPTlNRewUFDRae4msMuXaA&s=10">Image 3</option>
                </select>
            </div>
            <div class = "entry-input">
                <input type="text" id="lessonInput" placeholder="What did you do after your negative space?">
                <button class = "button" id="saveReflectionButton">Save</button>
            </div>
        </div>
        <script src="Journal.js"></script>
    </body>
</html>
